# Builds the app on every push to main and publishes the static bundle to the `deploy` branch.
# Hostinger auto-deploys the `deploy` branch (static site, connected 22 Nov 2026), so every push to main goes live.
name: Build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build stamp (shows which commit is live at /version.json)
        run: |
          node -e "require('fs').writeFileSync('dist/version.json', JSON.stringify({version: require('./package.json').version, commit: process.env.GITHUB_SHA.slice(0,7), built_at: new Date().toISOString()}, null, 2) + '\n')"
          cat dist/version.json
      - name: Publish dist/ to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
